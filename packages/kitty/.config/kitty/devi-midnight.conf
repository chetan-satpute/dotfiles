# vim:ft=kitty

## name: Devi Midnight
## source: Tailwind theme tokens (indigo, sapphire, gold, pearl, midnight, garnet, amber, teal)
## Each value maps to a semantic token from the theme.

background #0D0E1A                  # --background (midnight-950)
foreground #C6C7D4                  # midnight-200
selection_foreground #C6C7D4        # midnight-200
selection_background #1B3557        # sapphire-800
url_color #5D89C5                   # --info (sapphire-400)
cursor #CCA757                      # --accent (gold-400)
cursor_text_color #0D0E1A           # --accent-foreground (midnight-950)

# Tabs
active_tab_background #4755A6       # --primary (indigo-500)
active_tab_foreground #F8F7F4       # --primary-foreground (pearl-50)
inactive_tab_background #22232D     # --surface-1 (midnight-900)
inactive_tab_foreground #A5A7BB     # --muted-foreground (midnight-300)
#tab_bar_background #080A16         # indigo-975

# Windows
active_border_color #6572BD         # --ring (indigo-400)
inactive_border_color #424357       # --border (midnight-700)

# normal
color0 #22232D                      # midnight-900
color1 #B63759                      # --destructive (garnet-500)
color2 #5AC9BD                      # --success (teal-400)
color3 #CCA757                      # gold-400
color4 #5D89C5                      # --info (sapphire-400)
color5 #949CCC                      # indigo-300
color6 #8DD3CC                      # teal-300
color7 #A5A7BB                      # midnight-300

# bright
color8 #53556E                      # midnight-600
color9 #CC5676                      # garnet-400
color10 #8DD3CC                     # --success-hover (teal-300)
color11 #D5BE8B                     # --accent-hover (gold-300)
color12 #8FABD1                     # --info-hover (sapphire-300)
color13 #BEC3DC                     # indigo-200
color14 #BAE0DC                     # teal-200
color15 #C6C7D4                     # midnight-200

# extended colors
color16 #D98A3D                     # --warning (amber-500)
color17 #8C2A44                     # garnet-600

# Marks
mark1_foreground #0D0E1A
mark1_background #CCA757
mark2_foreground #0D0E1A
mark2_background #5D89C5
mark3_foreground #0D0E1A
mark3_background #CC5676
